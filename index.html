<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de CNPJ - ReceitaWS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>Buscador de Empresa</h1>
        
        <!-- Campo de busca e botão -->
        <div class="search-box">
            <input type="text" id="cnpjInput" placeholder="Digite o CNPJ (com ou sem pontuação)" maxlength="18">
            <button id="btnBuscar">Buscar</button>
        </div>
        
        <!-- Div que exibe a mensagem de carregamento (escondida por padrão) -->
        <div id="loading" style="display: none;">Buscando dados na ReceitaWS...</div>
        
        <!-- Div que receberá os dados formatados do JS -->
        <div id="resultado" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
